<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">customcute</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #030712;
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            position: relative;
        }

        #bgVideo {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            object-fit: cover;
            z-index: -2;
        }

        .bg-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.4);
            z-index: -1;
            pointer-events: none;
        }

        .top-right-bar {
            position: fixed;
            top: 15px;
            right: 15px;
            z-index: 50;
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(10px);
            padding: 8px 14px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .top-right-bar button {
            background: transparent;
            color: #fff;
            border: none;
            font-size: 13px;
            cursor: pointer;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .top-right-bar button:hover {
            color: #38bdf8;
        }

        .container {
            position: relative;
            z-index: 2;
            padding: 20px;
            max-width: 500px;
            width: 90%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            margin-top: 40px;
        }

        @media(min-width: 600px) {
            .container {
                flex-direction: row;
                align-items: flex-start;
                max-width: 600px;
            }
        }

        .left-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            flex-shrink: 0;
        }
        .avatar {
            width: 110px; height: 110px;
            border-radius: 50%;
            background: #1e293b;
            background-size: cover;
            background-position: center;
            box-shadow: 0 5px 20px rgba(0,0,0,0.5);
            border: 2px solid rgba(255,255,255,0.3);
            transition: 0.3s;
        }
        .avatar:hover { transform: scale(1.05); }
        .avatar-hint { font-size: 11px; color: #cbd5e1; margin-top: 8px; text-align: center; text-shadow: 0 1px 3px rgba(0,0,0,0.8); }
        #avatar-input { display: none; }

        .right-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            width: 100%;
            text-align: center;
        }
        @media(min-width: 600px) { .right-section { text-align: left; } }

        .name-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 6px;
        }
        @media(min-width: 600px) { .name-wrapper { justify-content: flex-start; } }

        .name { font-size: 26px; font-weight: bold; color: #f8fafc; text-shadow: 0 2px 10px rgba(0,0,0,0.9); }
        
        .badge {
            font-size: 10px;
            font-weight: bold;
            padding: 3px 8px;
            border-radius: 20px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .badge-owner { background: linear-gradient(135deg, #f59e0b, #ef4444); color: #fff; box-shadow: 0 0 10px rgba(239, 68, 68, 0.6); }
        .badge-vip { background: linear-gradient(135deg, #a855f7, #ec4899); color: #fff; box-shadow: 0 0 10px rgba(168, 85, 247, 0.6); }
        .badge-basic { background: rgba(255, 255, 255, 0.2); color: #e2e8f0; }

        .bio { font-size: 14px; color: #e2e8f0; margin-bottom: 20px; line-height: 1.4; text-shadow: 0 1px 5px rgba(0,0,0,0.9); }

        .links {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
        }
        
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: rgba(0, 0, 0, 0.25);
            backdrop-filter: blur(8px);
            color: #fff;
            padding: 12px 20px;
            border-radius: 14px;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            border: 1px solid rgba(255, 255, 255, 0.35);
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            transition: 0.25s ease;
        }
        .btn:hover { 
            background: rgba(255, 255, 255, 0.15); 
            transform: translateY(-2px); 
            border-color: rgba(56, 189, 248, 0.8); 
        }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 100;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .modal-content {
            background: #0f172a;
            padding: 25px;
            border-radius: 20px;
            width: 100%;
            max-width: 420px;
            border: 1px solid rgba(255,255,255,0.15);
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 25px 50px rgba(0,0,0,0.7);
        }
        .modal-content h3 { margin-bottom: 15px; font-size: 18px; color: #38bdf8; }
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 12px; margin-bottom: 5px; color: #94a3b8; }
        .form-group input, .form-group select {
            width: 100%; padding: 10px; background: #1e293b; border: 1px solid #334155;
            color: #fff; border-radius: 8px; font-size: 14px; outline: none;
        }
        .form-group input:focus, .form-group select:focus { border-color: #38bdf8; }
        .modal-btns { display: flex; justify-content: flex-end; gap: 10px; margin-top: 15px; }
        .modal-btns button { padding: 8px 16px; border-radius: 8px; border: none; cursor: pointer; font-weight: bold; font-size: 13px; }
        .btn-save { background: #38bdf8; color: #0f172a; }
        .btn-close { background: #334155; color: #fff; }
        .switch-text { font-size: 12px; color: #94a3b8; text-align: center; margin-top: 12px; cursor: pointer; }
        .switch-text span { color: #38bdf8; text-decoration: underline; }
        
        .admin-panel-box {
            background: rgba(30, 41, 59, 0.5);
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 15px;
            border: 1px dashed rgba(56, 189, 248, 0.4);
        }
    </style>
</head>
<body>

    <video id="bgVideo" autoplay muted loop playsinline style="display:none;">
        <source src="" type="video/mp4" id="videoSource">
    </video>
    <div class="bg-overlay"></div>

    <audio id="bgMusic" loop autoplay>
        <source id="audioSource" src="" type="audio/mp3">
    </audio>

    <div class="top-right-bar" id="topRightBar"></div>

    <div class="container">
        <div class="left-section" onclick="document.getElementById('avatar-input').click()">
            <div class="avatar" id="avatarDisplay" style="background-image: url('https://via.placeholder.com/150')"></div>
            <span class="avatar-hint">Bấm đổi ảnh</span>
            <input type="file" id="avatar-input" accept="image/*" onchange="previewAvatar(event)">
        </div>

        <div class="right-section">
            <div class="name-wrapper">
                <span class="badge" id="userBadge">BASIC</span>
                <div class="name" id="displayName">customcute</div>
            </div>
            <div class="bio" id="displayBio">Chào mừng bạn đến với trang cá nhân của tôi!</div>
            
            <div class="links" id="linksContainer"></div>
        </div>
    </div>

    <div class="modal" id="authModal">
        <div class="modal-content">
            <div id="loginForm">
                <h3>🔑 Đăng Nhập Hệ Thống</h3>
                <div class="form-group">
                    <label>Tài khoản</label>
                    <input type="text" id="loginUser" placeholder="Nhập tài khoản...">
                </div>
                <div class="form-group">
                    <label>Mật khẩu</label>
                    <input type="password" id="loginPass" placeholder="Nhập mật khẩu...">
                </div>
                <div class="modal-btns">
                    <button class="btn-close" onclick="closeModal()">Đóng</button>
                    <button class="btn-save" onclick="handleLogin()">Đăng Nhập</button>
                </div>
                <div class="switch-text" onclick="openAuthModal('register')">Chưa có tài khoản? <span>Đăng ký ngay</span></div>
            </div>

            <div id="registerForm" style="display:none;">
                <h3>✨ Đăng Ký Tài Khoản Mới</h3>
                <div class="form-group">
                    <label>Tài khoản mới</label>
                    <input type="text" id="regUser" placeholder="Tạo tên tài khoản...">
                </div>
                <div class="form-group">
                    <label>Mật khẩu mới</label>
                    <input type="password" id="regPass" placeholder="Tạo mật khẩu...">
                </div>
                <div class="modal-btns">
                    <button class="btn-close" onclick="closeModal()">Đóng</button>
                    <button class="btn-save" onclick="handleRegister()">Đăng Ký</button>
                </div>
                <div class="switch-text" onclick="openAuthModal('login')">Đã có tài khoản? <span>Đăng nhập</span></div>
            </div>

            <div id="editForm" style="display:none;">
                <h3>🛠️ Cấu Hình (<span id="currentAdminName"></span>)</h3>
                
                <div id="ownerControlPanel" class="admin-panel-box" style="display:none;">
                    <label style="color:#f59e0b; font-weight:bold; margin-bottom:5px; display:block;">👑 Bảng Quản Trị Owner</label>
                    <div class="form-group">
                        <label>Nâng cấp tài khoản bất kỳ thành VIP</label>
                        <input type="text" id="targetVipUser" placeholder="Nhập tên tài khoản cần cấp VIP...">
                    </div>
                    <button class="btn-save" style="width:100%; margin-top:5px; background:#f59e0b; color:#fff;" onclick="upgradeToVip()">Cấp Quyền VIP</button>
                </div>

                <div class="form-group">
                    <label>Tên hiển thị</label>
                    <input type="text" id="inputName">
                </div>
                <div class="form-group">
                    <label>Tiểu sử (Bio)</label>
                    <input type="text" id="inputBio">
                </div>
                <div class="form-group">
                    <label>Chọn số lượng link muốn hiển thị</label>
                    <select id="linkCountSelect" onchange="renderLinkInputs()">
                        <option value="1">1 Link</option>
                        <option value="2">2 Link</option>
                        <option value="3">3 Link</option>
                        <option value="4">4 Link</option>
                        <option value="5">5 Link</option>
                    </select>
                </div>
                <div id="dynamicLinkInputs"></div>
                
                <div class="form-group">
                    <label>Chọn Background</label>
                    <select id="inputBgSelect" onchange="onBgSelectChange()">
                        <option value="VID_SHOOTING">🌠 Sao Băng Đêm (Yêu thích của Owner)</option>
                        <option value="VID_GALAXY">🌌 Vũ Trụ Huyền Ao & Thiên Hà</option>
                        <option value="VID_RAIN">🌧️ Mưa Đêm Buồn Lãng Mạn</option>
                        <option value="VID_FIRE">🔥 Ngọn Lửa Trái Tim Ấm Áp</option>
                        <option value="VID_NEON">🌆 Cyberpunk Neon Động</option>
                        <option value="VID_ANIME">✨ Anime Chill Động</option>
                        <option value="CUSTOM_FILE">📁 Tự chọn Ảnh/Video từ thiết bị (Đt/Máy tính)</option>
                    </select>
                </div>

                <div class="form-group" id="customFileGroup" style="display:none;">
                    <label>Bấm vào đây để chọn file từ máy</label>
                    <input type="file" id="inputCustomFile" accept="image/*,video/*" style="padding: 8px; background: #1e293b; cursor: pointer;">
                </div>

                <div class="form-group">
                    <label>Đường dẫn link nhạc MP3 trực tuyến</label>
                    <input type="text" id="inputMusicUrl" placeholder="Dán link mp3 trực tiếp...">
                </div>
                <div class="modal-btns">
                    <button class="btn-close" onclick="closeModal()">Đóng</button>
                    <button class="btn-save" onclick="saveChanges()">Lưu Thay Đổi</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let usersDB = [
            { user: "Mrwenben", pass: "Mrwenben0707@.@", role: "owner" }
        ];
        
        let savedUsers = localStorage.getItem('usersDB_v7');
        if (savedUsers) {
            try {
                let parsed = JSON.parse(savedUsers);
                if(!parsed.some(u => u.user === "Mrwenben")) {
                    parsed.unshift({ user: "Mrwenben", pass: "Mrwenben0707@.@", role: "owner" });
                }
                usersDB = parsed;
            } catch(e) {}
        }
        localStorage.setItem('usersDB_v7', JSON.stringify(usersDB));

        let loggedInUser = localStorage.getItem('loggedInUser_v7') || "Mrwenben";

        function getUserRole(username) {
            let acc = usersDB.find(u => u.user === username);
            return acc ? acc.role : "basic";
        }

        function getUserData(username) {
            let defaultData = {
                name: "customcute",
                bio: "Chào mừng bạn đến với trang cá nhân của tôi!",
                links: [
                    { name: "Facebook", url: "https://facebook.com" },
                    { name: "Tiktok", url: "https://tiktok.com" },
                    { name: "Instagram", url: "https://instagram.com" }
                ],
                avatar: "https://via.placeholder.com/150",
                music: "",
                bg: "VID_SHOOTING",
                customFile: "",
                customFileType: ""
            };
            let saved = localStorage.getItem('userData_v7_' + username);
            return saved ? JSON.parse(saved) : defaultData;
        }

        let siteData = getUserData(loggedInUser);

        function updateUI() {
            let role = getUserRole(loggedInUser);
            let badgeEl = document.getElementById('userBadge');
            
            if(role === 'owner') {
                badgeEl.innerText = "OWNER";
                badgeEl.className = "badge badge-owner";
            } else if(role === 'vip') {
                badgeEl.innerText = "VIP";
                badgeEl.className = "badge badge-vip";
            } else {
                badgeEl.innerText = "BASIC";
                badgeEl.className = "badge badge-basic";
            }

            let topRightBar = document.getElementById('topRightBar');
            if(loggedInUser) {
                topRightBar.innerHTML = `
                    <div style="display: flex; align-items: center; gap: 8px;">
                        <span class="badge ${badgeEl.className.replace('badge ', '')}">${badgeEl.innerText}</span>
                        <span style="font-weight: 600; font-size: 13px; color: #fff;">${loggedInUser}</span>
                        <button onclick="openEditForm()" title="Cấu hình" style="background: rgba(56, 189, 248, 0.2); border: 1px solid #38bdf8; padding: 4px 8px; border-radius: 6px; color: #38bdf8;">⚙️</button>
                        <button onclick="handleLogout()" title="Đăng xuất" style="background: rgba(239, 68, 68, 0.2); border: 1px solid #ef4444; padding: 4px 8px; border-radius: 6px; color: #ef4444;">🚪</button>
                    </div>
                `;
            } else {
                topRightBar.innerHTML = `
                    <button onclick="openAuthModal('login')">🔑 Đăng nhập</button>
                    <span style="color: rgba(255,255,255,0.3)">|</span>
                    <button onclick="openAuthModal('register')">✨ Đăng ký</button>
                `;
            }

            document.getElementById('displayName').innerText = siteData.name;
            document.getElementById('displayBio').innerText = siteData.bio;
            
            let linksContainer = document.getElementById('linksContainer');
            linksContainer.innerHTML = "";
            if(siteData.links && siteData.links.length > 0) {
                siteData.links.forEach(item => {
                    let a = document.createElement('a');
                    a.href = item.url || "#";
                    a.className = "btn";
                    a.target = "_blank";
                    a.innerText = item.name || "Liên kết";
                    linksContainer.appendChild(a);
                });
            }

            if(siteData.avatar) document.getElementById('avatarDisplay').style.backgroundImage = `url('${siteData.avatar}')`;
            
            let bgVal = siteData.bg;
            let videoEl = document.getElementById('bgVideo');
            
            let videoUrls = {
                "VID_SHOOTING": "https://assets.mixkit.co/videos/preview/mixkit-stars-in-space-background-1610-large.mp4",
                "VID_GALAXY": "https://assets.mixkit.co/videos/preview/mixkit-digital-animation-of-screens-and-lights-31940-large.mp4",
                "VID_RAIN": "https://assets.mixkit.co/videos/preview/mixkit-raindrops-falling-on-glass-1200-large.mp4",
                "VID_FIRE": "https://assets.mixkit.co/videos/preview/mixkit-flames-in-a-dark-background-5058-large.mp4",
                "VID_NEON": "https://assets.mixkit.co/videos/preview/mixkit-futuristic-city-with-neon-lights-41712-large.mp4",
                "VID_ANIME": "https://assets.mixkit.co/videos/preview/mixkit-purple-and-blue-fluorescent-lights-background-41483-large.mp4"
            };

            if(bgVal === "CUSTOM_FILE") {
                if(siteData.customFile) {
                    if(siteData.customFileType && siteData.customFileType.startsWith('video')) {
                        videoEl.style.display = "block";
                        videoEl.src = siteData.customFile;
                        videoEl.play().catch(e => {});
                        document.body.style.backgroundImage = "none";
                    } else {
                        videoEl.style.display = "none";
                        document.body.style.backgroundImage = `url('${siteData.customFile}')`;
                        document.body.style.backgroundSize = "cover";
                        document.body.style.backgroundPosition = "center";
                    }
                }
            } else if(videoUrls[bgVal]) {
                videoEl.style.display = "block";
                document.body.style.backgroundImage = "none";
                if(videoEl.src !== videoUrls[bgVal]) {
                    videoEl.src = videoUrls[bgVal];
                    videoEl.play().catch(e => {});
                }
            }

            if(siteData.music) {
                let musicEl = document.getElementById('bgMusic');
                if(musicEl.src !== siteData.music) {
                    musicEl.src = siteData.music;
                    musicEl.play().catch(e => {});
                }
            }
        }
        updateUI();

        document.addEventListener('click', function() {
            let musicEl = document.getElementById('bgMusic');
            if(musicEl.src && musicEl.paused) {
                musicEl.play().catch(e => {});
            }
        }, { once: true });

        function openAuthModal(type) {
            document.getElementById('authModal').style.display = 'flex';
            document.getElementById('loginForm').style.display = (type === 'login') ? 'block' : 'none';
            document.getElementById('registerForm').style.display = (type === 'register') ? 'block' : 'none';
            document.getElementById('editForm').style.display = 'none';
        }

        function closeModal() {
            document.getElementById('authModal').style.display = 'none';
        }

        function handleLogin() {
            let u = document.getElementById('loginUser').value.trim();
            let p = document.getElementById('loginPass').value.trim();
            let found = usersDB.find(acc => acc.user === u && acc.pass === p);

            if(found) {
                loggedInUser = u;
                localStorage.setItem('loggedInUser_v7', u);
                siteData = getUserData(u);
                updateUI();
                closeModal();
            } else {
                alert("❌ Sai tài khoản hoặc mật khẩu!");
            }
        }

        function handleLogout() {
            loggedInUser = "";
            localStorage.removeItem('loggedInUser_v7');
            updateUI();
        }

        function handleRegister() {
            let u = document.getElementById('regUser').value.trim();
            let p = document.getElementById('regPass').value.trim();

            if(!u || !p) {
                alert("Vui lòng điền đầy đủ tài khoản và mật khẩu!");
                return;
            }

            if(usersDB.some(acc => acc.user === u)) {
                alert("❌ Tài khoản này đã tồn tại!");
                return;
            }

            usersDB.push({ user: u, pass: p, role: "basic" });
            localStorage.setItem('usersDB_v7', JSON.stringify(usersDB));
            
            loggedInUser = u;
            localStorage.setItem('loggedInUser_v7', u);
            siteData = getUserData(u);
            updateUI();
            closeModal();
            alert("✅ Đăng ký thành công!");
        }

        function openEditForm() {
            document.getElementById('authModal').style.display = 'flex';
            document.getElementById('loginForm').style.display = 'none';
            document.getElementById('registerForm').style.display = 'none';
            document.getElementById('editForm').style.display = 'block';
            document.getElementById('currentAdminName').innerText = loggedInUser;

            let role = getUserRole(loggedInUser);
            let ownerPanel = document.getElementById('ownerControlPanel');
            ownerPanel.style.display = (role === 'owner') ? 'block' : 'none';

            document.getElementById('inputName').value = siteData.name;
            document.getElementById('inputBio').value = siteData.bio;
            document.getElementById('inputMusicUrl').value = siteData.music || "";
            document.getElementById('inputBgSelect').value = siteData.bg || "VID_SHOOTING";
            
            onBgSelectChange();

            let count = siteData.links ? siteData.links.length : 3;
            document.getElementById('linkCountSelect').value = count > 5 ? 5 : count;
            renderLinkInputs();
        }

        function onBgSelectChange() {
            let val = document.getElementById('inputBgSelect').value;
            let customFileGroup = document.getElementById('customFileGroup');
            if(val === 'CUSTOM_FILE') {
                customFileGroup.style.display = 'block';
            } else {
                customFileGroup.style.display = 'none';
            }
        }

        function renderLinkInputs() {
            let count = parseInt(document.getElementById('linkCountSelect').value);
            let container = document.getElementById('dynamicLinkInputs');
            container.innerHTML = "";

            for(let i=0; i<count; i++) {
                let existingName = (siteData.links && siteData.links[i]) ? siteData.links[i].name : `Link ${i+1}`;
                let existingUrl = (siteData.links && siteData.links[i]) ? siteData.links[i].url : '';

                container.innerHTML += `
                    <div style="display:flex; gap:8px; margin-bottom:8px;">
                        <input type="text" id="linkName_${i}" placeholder="Tên nút ${i+1}" value="${existingName}" style="flex:1;">
                        <input type="text" id="linkUrl_${i}" placeholder="Đường dẫn URL" value="${existingUrl}" style="flex:2;">
                    </div>
                `;
            }
        }

        function upgradeToVip() {
            let targetName = document.getElementById('targetVipUser').value.trim();
            let targetAcc = usersDB.find(u => u.user === targetName);
            if(targetAcc) {
                targetAcc.role = 'vip';
                localStorage.setItem('usersDB_v7', JSON.stringify(usersDB));
                alert(`✅ Đã nâng cấp tài khoản ${targetName} lên VIP thành công!`);
            } else {
                alert("❌ Không tìm thấy tên tài khoản này!");
            }
        }

        function saveChanges() {
            siteData.name = document.getElementById('inputName').value;
            siteData.bio = document.getElementById('inputBio').value;
            siteData.bg = document.getElementById('inputBgSelect').value;
            siteData.music = document.getElementById('inputMusicUrl').value.trim();

            let count = parseInt(document.getElementById('linkCountSelect').value);
            siteData.links = [];
            for(let i=0; i<count; i++) {
                let n = document.getElementById(`linkName_${i}`).value;
                let u = document.getElementById(`linkUrl_${i}`).value;
                siteData.links.push({ name: n, url: u });
            }

            let fileInput = document.getElementById('inputCustomFile');
            if(siteData.bg === 'CUSTOM_FILE' && fileInput.files && fileInput.files[0]) {
                let file = fileInput.files[0];
                let reader = new FileReader();
                reader.onload = function(e) {
                    siteData.customFile = e.target.result;
                    siteData.customFileType = file.type;
                    localStorage.setItem('userData_v7_' + loggedInUser, JSON.stringify(siteData));
                    updateUI();
                    closeModal();
                    alert("✅ Đã lưu thay đổi thành công!");
                }
                reader.readAsDataURL(file);
            } else {
                localStorage.setItem('userData_v7_' + loggedInUser, JSON.stringify(siteData));
                updateUI();
                closeModal();
                alert("✅ Đã lưu thay đổi thành công!");
            }
        }

        function previewAvatar(event) {
            let file = event.target.files[0];
            if(file) {
                let reader = new FileReader();
                reader.onload = function(e) {
                    siteData.avatar = e.target.result;
                    localStorage.setItem('userData_v7_' + loggedInUser, JSON.stringify(siteData));
                    updateUI();
                }
                reader.readAsDataURL(file);
            }
        }
    </script>
</body>
</html>
