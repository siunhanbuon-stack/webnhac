<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">Trang Cá Nhân Của Bạn</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #030712;
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            position: relative;
        }

        /* Hiệu ứng sao băng rải khắp màn hình */
        .shooting-stars {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            overflow: hidden;
            z-index: 1;
        }
        .star {
            position: absolute;
            width: 2px; height: 2px;
            background: #fff;
            box-shadow: 0 0 10px #fff, 0 0 20px #38bdf8;
            animation: shoot linear infinite;
            opacity: 0;
        }
        @keyframes shoot {
            0% { transform: translateY(-150px) translateX(0); opacity: 1; }
            100% { transform: translateY(110vh) translateX(-300px); opacity: 0; }
        }

        /* Container chìm trực tiếp vào background */
        .container {
            position: relative;
            z-index: 2;
            padding: 20px;
            max-width: 500px;
            width: 90%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        @media(min-width: 600px) {
            .container {
                flex-direction: row;
                align-items: flex-start;
                max-width: 600px;
            }
        }

        /* Avatar không khung, chìm vào nền */
        .left-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            flex-shrink: 0;
        }
        .avatar {
            width: 110px; height: 110px;
            border-radius: 50%;
            background: #1e293b;
            background-size: cover;
            background-position: center;
            box-shadow: 0 5px 20px rgba(0,0,0,0.5);
            transition: 0.3s;
        }
        .avatar:hover { transform: scale(1.05); }
        .avatar-hint { font-size: 11px; color: #94a3b8; margin-top: 8px; text-align: center; }
        #avatar-input { display: none; }

        /* Thông tin bên phải */
        .right-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            width: 100%;
            text-align: center;
        }
        @media(min-width: 600px) { .right-section { text-align: left; } }

        .name { font-size: 26px; font-weight: bold; margin-bottom: 6px; color: #f8fafc; text-shadow: 0 2px 10px rgba(0,0,0,0.8); }
        .bio { font-size: 14px; color: #cbd5e1; margin-bottom: 20px; line-height: 1.4; text-shadow: 0 1px 5px rgba(0,0,0,0.8); }

        /* Nút mạng xã hội trong suốt mượt mà */
        .links {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
        }
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(10px);
            color: #fff;
            padding: 12px 20px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: 0.25s ease;
        }
        .btn:hover { background: rgba(30, 41, 59, 0.8); transform: translateY(-2px); border-color: rgba(56, 189, 248, 0.5); }

        /* Nút Chỉnh sửa / Đăng nhập ở dưới */
        .nav-actions {
            display: flex;
            gap: 15px;
            margin-top: 20px;
            justify-content: center;
        }
        @media(min-width: 600px) { .nav-actions { justify-content: flex-start; } }

        .action-link {
            background: transparent;
            color: #94a3b8;
            border: none;
            font-size: 12px;
            cursor: pointer;
            text-decoration: underline;
            transition: 0.2s;
        }
        .action-link:hover { color: #fff; }

        /* Modal Quản trị & Đăng nhập */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            z-index: 100;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .modal-content {
            background: #0f172a;
            padding: 25px;
            border-radius: 20px;
            width: 100%;
            max-width: 400px;
            border: 1px solid rgba(255,255,255,0.15);
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 25px 50px rgba(0,0,0,0.7);
        }
        .modal-content h3 { margin-bottom: 15px; font-size: 18px; color: #38bdf8; }
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 12px; margin-bottom: 5px; color: #94a3b8; }
        .form-group input {
            width: 100%; padding: 10px; background: #1e293b; border: 1px solid #334155;
            color: #fff; border-radius: 8px; font-size: 14px; outline: none;
        }
        .form-group input:focus { border-color: #38bdf8; }
        .modal-btns { display: flex; justify-content: flex-end; gap: 10px; margin-top: 15px; }
        .modal-btns button { padding: 8px 16px; border-radius: 8px; border: none; cursor: pointer; font-weight: bold; font-size: 13px; }
        .btn-save { background: #38bdf8; color: #0f172a; }
        .btn-close { background: #334155; color: #fff; }
        .switch-text { font-size: 12px; color: #94a3b8; text-align: center; margin-top: 12px; cursor: pointer; }
        .switch-text span { color: #38bdf8; text-decoration: underline; }
    </style>
</head>
<body>

    <div class="shooting-stars" id="starContainer"></div>

    <audio id="bgMusic" loop>
        <source id="audioSource" src="" type="audio/mp3">
    </audio>

    <div class="container">
        <div class="left-section" onclick="document.getElementById('avatar-input').click()">
            <div class="avatar" id="avatarDisplay" style="background-image: url('https://via.placeholder.com/150')"></div>
            <span class="avatar-hint">Bấm đổi ảnh</span>
            <input type="file" id="avatar-input" accept="image/*" onchange="previewAvatar(event)">
        </div>

        <div class="right-section">
            <div class="name" id="displayName">Tên Của Bạn</div>
            <div class="bio" id="displayBio">Tiểu sử hoặc châm ngôn sống...</div>
            
            <div class="links">
                <a href="#" id="linkFb" class="btn" target="_blank">🌐 Facebook</a>
                <a href="#" id="linkTiktok" class="btn" target="_blank">🎵 Tiktok</a>
                <a href="#" id="linkIg" class="btn" target="_blank">📸 Instagram</a>
            </div>

            <div class="nav-actions">
                <button class="action-link" onclick="openAuthModal('login')">🔑 Đăng nhập</button>
                <button class="action-link" onclick="openAuthModal('register')">✨ Đăng ký tài khoản</button>
            </div>
        </div>
    </div>

    <div class="modal" id="authModal">
        <div class="modal-content">
            <div id="loginForm">
                <h3 id="modalTitle">🔑 Đăng Nhập Hệ Thống</h3>
                <div class="form-group">
                    <label>Tài khoản</label>
                    <input type="text" id="loginUser" placeholder="Nhập tài khoản...">
                </div>
                <div class="form-group">
                    <label>Mật khẩu</label>
                    <input type="password" id="loginPass" placeholder="Nhập mật khẩu...">
                </div>
                <div class="modal-btns">
                    <button class="btn-close" onclick="closeModal()">Đóng</button>
                    <button class="btn-save" onclick="handleLogin()">Đăng Nhập</button>
                </div>
                <div class="switch-text" onclick="openAuthModal('register')">Chưa có tài khoản? <span>Đăng ký ngay</span></div>
            </div>

            <div id="registerForm" style="display:none;">
                <h3>✨ Đăng Ký Tài Khoản Mới</h3>
                <div class="form-group">
                    <label>Tài khoản mới</label>
                    <input type="text" id="regUser" placeholder="Tạo tên tài khoản...">
                </div>
                <div class="form-group">
                    <label>Mật khẩu mới</label>
                    <input type="password" id="regPass" placeholder="Tạo mật khẩu...">
                </div>
                <div class="modal-btns">
                    <button class="btn-close" onclick="closeModal()">Đóng</button>
                    <button class="btn-save" onclick="handleRegister()">Đăng Ký</button>
                </div>
                <div class="switch-text" onclick="openAuthModal('login')">Đã có tài khoản? <span>Đăng nhập</span></div>
            </div>

            <div id="editForm" style="display:none;">
                <h3>🛠️ Cấu Hình Trang Web (<span id="currentAdminName"></span>)</h3>
                <div class="form-group">
                    <label>Tên hiển thị</label>
                    <input type="text" id="inputName">
                </div>
                <div class="form-group">
                    <label>Tiểu sử (Bio)</label>
                    <input type="text" id="inputBio">
                </div>
                <div class="form-group">
                    <label>Link Facebook</label>
                    <input type="text" id="inputFb">
                </div>
                <div class="form-group">
                    <label>Link Tiktok</label>
                    <input type="text" id="inputTiktok">
                </div>
                <div class="form-group">
                    <label>Link Instagram</label>
                    <input type="text" id="inputIg">
                </div>
                <div class="form-group">
                    <label>Tải lên nhạc MP3 mới</label>
                    <input type="file" id="inputMusic" accept="audio/mp3">
                </div>
                <div class="modal-btns">
                    <button class="btn-close" onclick="closeModal()">Đóng</button>
                    <button class="btn-save" onclick="saveChanges()">Lưu Thay Đổi</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Danh sách tài khoản mặc định (có thể đăng ký thêm trực tiếp)
        let usersDB = JSON.parse(localStorage.getItem('usersDB')) || [
            { user: "admin", pass: "123456" },
            { user: "boss", pass: "admin666" }
        ];

        let loggedInUser = localStorage.getItem('loggedInUser') || "admin";

        // Lấy dữ liệu riêng biệt của từng tài khoản
        function getUserData(username) {
            let defaultData = {
                name: "Tên Của Bạn",
                bio: "Tiểu sử hoặc châm ngôn sống...",
                fb: "https://facebook.com",
                tiktok: "https://tiktok.com",
                ig: "https://instagram.com",
                avatar: "https://via.placeholder.com/150",
                music: ""
            };
            let saved = localStorage.getItem('userData_' + username);
            return saved ? JSON.parse(saved) : defaultData;
        }

        let siteData = getUserData(loggedInUser);

        // Hiệu ứng sao băng
        const starContainer = document.getElementById('starContainer');
        for (let i = 0; i < 35; i++) {
            let star = document.createElement('div');
            star.className = 'star';
            star.style.top = Math.random() * 100 + '%';
            star.style.left = Math.random() * 100 + '%';
            star.style.animationDuration = (Math.random() * 3 + 2) + 's';
            star.style.animationDelay = (Math.random() * 5) + 's';
            starContainer.appendChild(star);
        }

        function updateUI() {
            document.getElementById('displayName').innerText = siteData.name;
            document.getElementById('displayBio').innerText = siteData.bio;
            document.getElementById('linkFb').href = siteData.fb;
            document.getElementById('linkTiktok').href = siteData.tiktok;
            document.getElementById('linkIg').href = siteData.ig;
            if(siteData.avatar) document.getElementById('avatarDisplay').style.backgroundImage = `url('${siteData.avatar}')`;
            
            if(siteData.music) {
                let musicEl = document.getElementById('bgMusic');
                musicEl.src = siteData.music;
                musicEl.play().catch(e => {});
            }
        }
        updateUI();

        document.addEventListener('click', function() {
            let musicEl = document.getElementById('bgMusic');
            if(musicEl.src && musicEl.paused) {
                musicEl.play().catch(e => {});
            }
        }, { once: true });

        // Xử lý Modal & Chuyển đổi form
        function openAuthModal(type) {
            document.getElementById('authModal').style.display = 'flex';
            document.getElementById('loginForm').style.display = (type === 'login') ? 'block' : 'none';
            document.getElementById('registerForm').style.display = (type === 'register') ? 'block' : 'none';
            document.getElementById('editForm').style.display = 'none';
        }

        function closeModal() {
            document.getElementById('authModal').style.display = 'none';
        }

        function handleLogin() {
            let u = document.getElementById('loginUser').value.trim();
            let p = document.getElementById('loginPass').value.trim();
            let found = usersDB.find(acc => acc.user === u && acc.pass === p);

            if(found) {
                loggedInUser = u;
                localStorage.setItem('loggedInUser', u);
                siteData = getUserData(u);
                updateUI();
                openEditForm();
            } else {
                alert("❌ Sai tài khoản hoặc mật khẩu!");
            }
        }

        function handleRegister() {
            let u = document.getElementById('regUser').value.trim();
            let p = document.getElementById('regPass').value.trim();

            if(!u || !p) {
                alert("Vui lòng điền đầy đủ tài khoản và mật khẩu!");
                return;
            }

            if(usersDB.some(acc => acc.user === u)) {
                alert("❌ Tài khoản này đã tồn tại, vui lòng chọn tên khác!");
                return;
            }

            usersDB.push({ user: u, pass: p });
            localStorage.setItem('usersDB', JSON.stringify(usersDB));
            
            loggedInUser = u;
            localStorage.setItem('loggedInUser', u);
            siteData = getUserData(u);
            updateUI();
            
            alert("✅ Đăng ký thành công! Đang chuyển vào bảng chỉnh sửa...");
            openEditForm();
        }

        function openEditForm() {
            document.getElementById('loginForm').style.display = 'none';
            document.getElementById('registerForm').style.display = 'none';
            document.getElementById('editForm').style.display = 'block';
            document.getElementById('currentAdminName').innerText = loggedInUser;

            document.getElementById('inputName').value = siteData.name;
            document.getElementById('inputBio').value = siteData.bio;
            document.getElementById('inputFb').value = siteData.fb;
            document.getElementById('inputTiktok').value = siteData.tiktok;
            document.getElementById('inputIg').value = siteData.ig;
        }

        function saveChanges() {
            siteData.name = document.getElementById('inputName').value;
            siteData.bio = document.getElementById('inputBio').value;
            siteData.fb = document.getElementById('inputFb').value;
            siteData.tiktok = document.getElementById('inputTiktok').value;
            siteData.ig = document.getElementById('inputIg').value;

            let musicFile = document.getElementById('inputMusic').files[0];
            
            function saveDataAndClose() {
                localStorage.setItem('userData_' + loggedInUser, JSON.stringify(siteData));
                updateUI();
                closeModal();
                alert("✅ Đã lưu thay đổi thành công cho tài khoản: " + loggedInUser);
            }

            if(musicFile) {
                let reader = new FileReader();
                reader.onload = function(e) {
                    siteData.music = e.target.result;
                    saveDataAndClose();
                }
                reader.readAsDataURL(musicFile);
            } else {
                saveDataAndClose();
            }
        }

        function previewAvatar(event) {
            let file = event.target.files[0];
            if(file) {
                let reader = new FileReader();
                reader.onload = function(e) {
                    siteData.avatar = e.target.result;
                    localStorage.setItem('userData_' + loggedInUser, JSON.stringify(siteData));
                    updateUI();
                }
                reader.readAsDataURL(file);
            }
        }
    </script>
</body>
</html>
