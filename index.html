<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">customcute</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #030712;
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            position: relative;
        }

        #bgImage, #bgVideo {
            position: fixed;
            top: 0; left: 0; 
            width: 100vw; height: 100vh;
            object-fit: cover;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            z-index: -2;
            display: none;
        }

        .bg-overlay {
            position: fixed;
            top: 0; left: 0; 
            width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.15);
            z-index: -1;
            pointer-events: none;
        }

        #starCanvas {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            z-index: -3;
            pointer-events: none;
            background: #030712;
        }

        .top-right-bar {
            position: fixed;
            top: 15px;
            right: 15px;
            z-index: 50;
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(10px);
            padding: 8px 14px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            font-size: 13px;
        }

        .top-right-bar span, .top-right-bar button {
            color: #fff;
            background: transparent;
            border: none;
            cursor: pointer;
            font-weight: 600;
            font-family: inherit;
        }

        .top-right-bar button:hover {
            color: #38bdf8;
        }

        .container {
            position: relative;
            z-index: 2;
            padding: 20px;
            max-width: 460px;
            width: 90%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            margin-top: 40px;
        }

        .profile-header {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 15px;
            transition: 0.3s ease;
        }

        .profile-header.layout-center {
            flex-direction: column;
            align-items: center;
            text-align: center;
        }
        .profile-header.layout-center .right-section {
            align-items: center;
            text-align: center;
        }
        .profile-header.layout-center .name-wrapper {
            justify-content: center;
        }

        .profile-header.layout-left {
            flex-direction: row;
            align-items: center;
            text-align: left;
        }
        .profile-header.layout-left .right-section {
            align-items: flex-start;
            text-align: left;
        }
        .profile-header.layout-left .name-wrapper {
            justify-content: flex-start;
        }

        .profile-header.layout-right {
            flex-direction: row-reverse;
            align-items: center;
            text-align: left;
        }
        .profile-header.layout-right .right-section {
            align-items: flex-start;
            text-align: left;
        }
        .profile-header.layout-right .name-wrapper {
            justify-content: flex-start;
        }

        .left-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            flex-shrink: 0;
        }
        .avatar {
            width: 100px; height: 100px;
            border-radius: 50%;
            background: #1e293b;
            background-size: cover;
            background-position: center;
            box-shadow: 0 5px 20px rgba(0,0,0,0.5);
            border: 2px solid rgba(255,255,255,0.3);
            transition: 0.3s;
        }
        .avatar:hover { transform: scale(1.05); }
        #avatar-input { display: none; }

        .right-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            width: 100%;
        }

        .name-wrapper {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 6px;
            flex-wrap: wrap;
        }

        .name { font-size: 24px; font-weight: bold; color: #f8fafc; text-shadow: 0 2px 10px rgba(0,0,0,0.9); }
        
        .badge {
            font-size: 10px;
            font-weight: bold;
            padding: 3px 8px;
            border-radius: 20px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .badge-owner { background: linear-gradient(135deg, #f59e0b, #ef4444); color: #fff; box-shadow: 0 0 10px rgba(239, 68, 68, 0.6); }
        .badge-vip { background: linear-gradient(135deg, #a855f7, #ec4899); color: #fff; box-shadow: 0 0 10px rgba(168, 85, 247, 0.6); }

        .bio { font-size: 13px; color: #e2e8f0; line-height: 1.4; text-shadow: 0 1px 5px rgba(0,0,0,0.9); width: 100%; }

        .links {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
            max-height: 55vh;
            overflow-y: auto;
            padding-right: 4px;
        }
        
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: rgba(0, 0, 0, 0.25);
            backdrop-filter: blur(8px);
            color: #fff;
            padding: 12px 20px;
            border-radius: 14px;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            border: 1px solid rgba(255, 255, 255, 0.35);
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            transition: 0.25s ease;
        }
        .btn:hover { 
            background: rgba(255, 255, 255, 0.15); 
            transform: translateY(-2px); 
            border-color: rgba(56, 189, 248, 0.8); 
        }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 100;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .modal-content {
            background: #0f172a;
            padding: 25px;
            border-radius: 20px;
            width: 100%;
            max-width: 420px;
            border: 1px solid rgba(255,255,255,0.15);
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 25px 50px rgba(0,0,0,0.7);
        }
        .modal-content h3 { margin-bottom: 15px; font-size: 18px; color: #38bdf8; }
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 12px; margin-bottom: 5px; color: #94a3b8; }
        .form-group input, .form-group select {
            width: 100%; padding: 10px; background: #1e293b; border: 1px solid #334155;
            color: #fff; border-radius: 8px; font-size: 14px; outline: none;
        }
        .form-group input:focus, .form-group select:focus { border-color: #38bdf8; }
        .modal-btns { display: flex; justify-content: flex-end; gap: 10px; margin-top: 15px; }
        .modal-btns button { padding: 8px 16px; border-radius: 8px; border: none; cursor: pointer; font-weight: bold; font-size: 13px; }
        .btn-save { background: #38bdf8; color: #0f172a; }
        .btn-close { background: #334155; color: #fff; }
        .switch-text { font-size: 12px; color: #94a3b8; text-align: center; margin-top: 12px; cursor: pointer; }
        .switch-text span { color: #38bdf8; text-decoration: underline; }
        
        .admin-panel-box {
            background: rgba(30, 41, 59, 0.5);
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 15px;
            border: 1px dashed rgba(56, 189, 248, 0.4);
        }
        .vip-link-box {
            background: #1e293b;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #38bdf8;
            margin-top: 5px;
            word-break: break-all;
            font-size: 12px;
            color: #e2e8f0;
            font-family: monospace;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
        }
        .btn-copy {
            background: #38bdf8;
            color: #0f172a;
            border: none;
            padding: 5px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 11px;
            font-weight: bold;
            white-space: nowrap;
        }
        .btn-copy:hover { background: #0ea5e9; }
        .vip-status-info {
            font-size: 11px;
            color: #38bdf8;
            margin-top: 4px;
        }
    </style>
</head>

    <!-- Modal Đăng nhập / Cấu hình -->

    <script>
        const canvas = document.getElementById('starCanvas');
        const ctx = canvas.getContext('2d');
        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        });

        let stars = [];
        for(let i=0; i<100; i++) {
            stars.push({
                x: Math.random() * width,
                y: Math.random() * height,
                radius: Math.random() * 1.5,
                alpha: Math.random(),
                speed: Math.random() * 0.05 + 0.01
            });
        }

        let shootingStars = [];
        function createShootingStar() {
            if(Math.random() < 0.04) {
                shootingStars.push({
                    x: Math.random() * width,
                    y: 0,
                    length: Math.random() * 80 + 40,
                    speed: Math.random() * 10 + 6,
                    angle: Math.PI / 4
                });
            }
        }

        function animateStars() {
            ctx.clearRect(0, 0, width, height);
            ctx.fillStyle = "#ffffff";
            stars.forEach(s => {
                ctx.globalAlpha = s.alpha;
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.radius, 0, Math.PI * 2);
                ctx.fill();
                s.alpha += s.speed;
                if(s.alpha > 1 || s.alpha < 0) s.speed = -s.speed;
            });

            ctx.strokeStyle = "rgba(255, 255, 255, 0.8)";
            ctx.lineWidth = 2;
            shootingStars.forEach((ss, index) => {
                ctx.beginPath();
                ctx.moveTo(ss.x, ss.y);
                ctx.lineTo(ss.x - ss.length * Math.cos(ss.angle), ss.y - ss.length * Math.sin(ss.angle));
                ctx.stroke();

                ss.x += ss.speed * Math.cos(ss.angle);
                ss.y += ss.speed * Math.sin(ss.angle);

                if(ss.x > width || ss.y > height) {
                    shootingStars.splice(index, 1);
                }
            });

            createShootingStar();
            requestAnimationFrame(animateStars);
        }
        animateStars();

        let usersDB = [
            { user: "Mrwenben", pass: "Mrwenben0707@.@", role: "owner", expire: 999999999999 }
        ];
        
        let savedUsers = localStorage.getItem('usersDB_v20');
        if (savedUsers) {
            try {
                let parsed = JSON.parse(savedUsers);
                if(!parsed.some(u => u.user.toLowerCase() === "mrwenben")) {
                    parsed.unshift({ user: "Mrwenben", pass: "Mrwenben0707@.@", role: "owner", expire: 999999999999 });
                }
                usersDB = parsed;
            } catch(e) {}
        }
        localStorage.setItem('usersDB_v20', JSON.stringify(usersDB));

        let loggedInUser = localStorage.getItem('loggedInUser_v20') || "";

        function checkVipExpiration() {
            let now = new Date().getTime();
            let updated = false;
            usersDB.forEach(u => {
                if(u.role === 'vip' && u.expire && u.expire < now) {
                    u.role = 'basic';
                    u.expire = 0;
                    updated = true;
                }
            });
            if(updated) {
                localStorage.setItem('usersDB_v20', JSON.stringify(usersDB));
            }
        }
        checkVipExpiration();

        function getTargetPageUser() {
            let hash = window.location.hash.replace('#', '').trim();
            if(hash) return hash;
            return "Mrwenben"; 
        }

        let viewingUser = getTargetPageUser();

        function getUserRole(username) {
            let acc = usersDB.find(u => u.user.toLowerCase() === username.toLowerCase());
            return acc ? acc.role : "basic";
        }

        function getUserExpire(username) {
            let acc = usersDB.find(u => u.user.toLowerCase() === username.toLowerCase());
            return acc ? acc.expire : 0;
        }

        function getUserData(username) {
            let defaultData = {
                name: username,
                bio: "Trang cá nhân chính thức",
                links: [
                    { name: "Facebook", url: "https://facebook.com" },
                    { name: "Tiktok", url: "https://tiktok.com" },
                    { name: "Instagram", url: "https://instagram.com" }
                ],
                avatar: "https://via.placeholder.com/150",
                music: "",
                bg: "VID_SHOOTING",
                showBadge: "yes",
                layout: "center"
            };
            let saved = localStorage.getItem('userData_v20_' + username.toLowerCase());
            return saved ? JSON.parse(saved) : defaultData;
        }

        let siteData = getUserData(viewingUser);

        function canEditCurrentPage() {
            if(!loggedInUser) return false;
            let role = getUserRole(loggedInUser);
            if(role === 'owner') return true;
            if(loggedInUser.toLowerCase() === viewingUser.toLowerCase()) return true;
            return false;
        }

        function updateUI() {
            checkVipExpiration(); 
            let role = getUserRole(viewingUser);
            let profileHeader = document.getElementById('profileHeader');
            profileHeader.className = "profile-header";
            let currentLayout = siteData.layout || "center";
            if (role === 'owner' || role === 'vip') {
                profileHeader.classList.add("layout-" + currentLayout);
            } else {
                profileHeader.classList.add("layout-center");
            }

            let badgeEl = document.getElementById('userBadge');
            if (role === 'owner' || role === 'vip') {
                if (role === 'owner') {
                    badgeEl.innerText = "OWNER";
                    badgeEl.className = "badge badge-owner";
                } else {
                    badgeEl.innerText = "VIP";
                    badgeEl.className = "badge badge-vip";
                }
                
                if (siteData.showBadge === "no") {
                    badgeEl.style.display = "none";
                } else {
                    badgeEl.style.display = "inline-block";
                }
            } else {
                badgeEl.style.display = "none";
            }

            let topRightBar = document.getElementById('topRightBar');
            let isOwnerPage = (viewingUser.toLowerCase() === "mrwenben");
            let isMyOwnPage = (loggedInUser && viewingUser.toLowerCase() === loggedInUser.toLowerCase());
            let isOwnerLoggedIn = (loggedInUser && getUserRole(loggedInUser) === 'owner');

            if (isOwnerPage || isMyOwnPage || isOwnerLoggedIn) {
                topRightBar.style.display = 'flex';
                let htmlBar = "";
                if(loggedInUser) {
                    if(!isMyOwnPage && !isOwnerPage) {
                        htmlBar += `<button onclick="goToMyPage()">Trang của tôi</button><span>/</span>`;
                    }
                    htmlBar += `<button onclick="openEditForm()">Cấu hình</button><span>/</span>`;
                    htmlBar += `<button onclick="handleLogout()">Đăng xuất</button>`;
                } else {
                    htmlBar += `<button onclick="openAuthModal('login')">Đăng nhập</button><span>/</span>`;
                    htmlBar += `<button onclick="openAuthModal('register')">Đăng ký</button>`;
                }
                topRightBar.innerHTML = htmlBar;
            } else {
                topRightBar.style.display = 'none';
            }

            document.getElementById('displayName').innerText = siteData.name;
            document.getElementById('displayBio').innerText = siteData.bio;
            
            let linksContainer = document.getElementById('linksContainer');
            linksContainer.innerHTML = "";
            if(siteData.links && siteData.links.length > 0) {
                siteData.links.forEach(item => {
                    let a = document.createElement('a');
                    a.href = item.url || "#";
                    a.className = "btn";
                    a.target = "_blank";
                    a.innerText = item.name || "Liên kết";
                    linksContainer.appendChild(a);
                });
            }

            if(siteData.avatar) document.getElementById('avatarDisplay').style.backgroundImage = `url('${siteData.avatar}')`;
            
            let canvasEl = document.getElementById('starCanvas');
            canvasEl.style.display = "block";

            if(siteData.music) {
                let musicEl = document.getElementById('bgMusic');
                if(musicEl.src !== siteData.music) {
                    musicEl.src = siteData.music;
                    musicEl.play().catch(e => {});
                }
            }
        }
        updateUI();

        window.addEventListener('hashchange', function() {
            viewingUser = getTargetPageUser();
            siteData = getUserData(viewingUser);
            location.reload();
        });

        function goToMyPage() {
            if(loggedInUser) {
                window.location.hash = "#" + loggedInUser;
            }
        }

        document.addEventListener('click', function() {
            let musicEl = document.getElementById('bgMusic');
            if(musicEl.src && musicEl.paused) {
                musicEl.play().catch(e => {});
            }
        }, { once: true });

        function openAuthModal(type) {
            document.getElementById('authModal').style.display = 'flex';
            document.getElementById('loginForm').style.display = (type === 'login') ? 'block' : 'none';
            document.getElementById('registerForm').style.display = (type === 'register') ? 'block' : 'none';
            document.getElementById('editForm').style.display = 'none';
        }

        function closeModal() {
            document.getElementById('authModal').style.display = 'none';
        }

        function handleLogin() {
            let u = document.getElementById('loginUser').value.trim();
            let p = document.getElementById('loginPass').value.trim();
            let found = usersDB.find(acc => acc.user.toLowerCase() === u.toLowerCase() && acc.pass === p);

            if(found) {
                checkVipExpiration();
                loggedInUser = found.user;
                localStorage.setItem('loggedInUser_v20', found.user);
                window.location.hash = "#" + found.user;
                viewingUser = found.user;
                siteData = getUserData(found.user);
                updateUI();
                closeModal();
                location.reload();
            } else {
                alert("❌ Sai tài khoản hoặc mật khẩu!");
            }
        }

        function handleLogout() {
            loggedInUser = "";
            localStorage.removeItem('loggedInUser_v20');
            window.location.hash = "#Mrwenben";
            viewingUser = "Mrwenben";
            siteData = getUserData("Mrwenben");
            updateUI();
            location.reload();
        }

        function handleRegister() {
            let u = document.getElementById('regUser').value.trim();
            let p = document.getElementById('regPass').value.trim();

            if(!u || !p) {
                alert("Vui lòng điền đầy đủ tài khoản và mật khẩu!");
                return;
            }

            if(usersDB.some(acc => acc.user.toLowerCase() === u.toLowerCase())) {
                alert("❌ Tài khoản này đã tồn tại!");
                return;
            }

            usersDB.push({ user: u, pass: p, role: "basic", expire: 0 });
            localStorage.setItem('usersDB_v20', JSON.stringify(usersDB));
            
            loggedInUser = u;
            localStorage.setItem('loggedInUser_v20', u);
            window.location.hash = "#" + u;
            viewingUser = u;
            siteData = getUserData(u);
            updateUI();
            closeModal();
            alert("✅ Đăng ký tài khoản Basic thành công!");
            location.reload();
        }

        function openEditForm() {
            if (loggedInUser && viewingUser.toLowerCase() !== loggedInUser.toLowerCase()) {
                let logRole = getUserRole(loggedInUser);
                if (logRole !== 'owner') {
                    window.location.hash = "#" + loggedInUser;
                    return;
                }
            }

            if(!canEditCurrentPage()) {
                alert("❌ Bạn không có quyền chỉnh sửa trang này!");
                return;
            }

            document.getElementById('authModal').style.display = 'flex';
            document.getElementById('loginForm').style.display = 'none';
            document.getElementById('registerForm').style.display = 'none';
            document.getElementById('editForm').style.display = 'block';
            document.getElementById('currentAdminName').innerText = viewingUser;

            let logRole = getUserRole(loggedInUser);
            let ownerPanel = document.getElementById('ownerControlPanel');
            ownerPanel.style.display = (logRole === 'owner') ? 'block' : 'none';

            // Khắc phục triệt để lỗi dán link qua Google/Chrome bị mất nội dung
            let cleanHref = window.location.href.split('#')[0];
            if (!cleanHref.endsWith('/')) {
                // Kiểm tra xem nếu URL là file github.io trực tiếp mà không có / ở cuối thì thêm vào hoặc giữ nguyên
                if (!cleanHref.includes('.html')) {
                    cleanHref += '/';
                }
            }
            let personalLink = cleanHref + "#" + viewingUser;
            document.getElementById('myVipLinkText').innerText = personalLink;

            let viewingRole = getUserRole(viewingUser);
            let expireTime = getUserExpire(viewingUser);
            if(viewingRole === 'owner') {
                document.getElementById('vipExpireInfoText').innerText = "⏳ Quyền: Vĩnh viễn (Owner)";
            } else if(viewingRole === 'vip') {
                let expireDateStr = new Date(expireTime).toLocaleString('vi-VN');
                document.getElementById('vipExpireInfoText').innerText = "⏳ Quyền VIP đến: " + expireDateStr;
            } else {
                document.getElementById('vipExpireInfoText').innerText = "💡 Quyền: Tài khoản Basic (Được tự do cấu hình tên, avatar, link, nhạc)";
            }

            let layoutConfigGroup = document.getElementById('layoutConfigGroup');
            let badgeConfigGroup = document.getElementById('badgeConfigGroup');
            if (viewingRole === 'owner' || viewingRole === 'vip') {
                layoutConfigGroup.style.display = 'block';
                badgeConfigGroup.style.display = 'block';
                document.getElementById('inputLayout').value = siteData.layout || "center";
                document.getElementById('inputShowBadge').value = siteData.showBadge || "yes";
            } else {
                layoutConfigGroup.style.display = 'none';
                badgeConfigGroup.style.display = 'none';
            }

            document.getElementById('inputName').value = siteData.name;
            document.getElementById('inputBio').value = siteData.bio;
            document.getElementById('inputMusicUrl').value = siteData.music || "";
            document.getElementById('inputModalAvatar').value = ""; 

            let count = siteData.links ? siteData.links.length : 3;
            document.getElementById('linkCountSelect').value = count > 10 ? 10 : count;
            renderLinkInputs();
        }

        function copyMyVipLink() {
            let linkText = document.getElementById('myVipLinkText').innerText;
            navigator.clipboard.writeText(linkText).then(() => {
                alert("📋 Đã sao chép đường link trang cá nhân chuẩn xác!");
            }).catch(err => {
                alert("❌ Không thể sao chép tự động!");
            });
        }

        function renderLinkInputs() {
            let count = parseInt(document.getElementById('linkCountSelect').value);
            let container = document.getElementById('dynamicLinkInputs');
            container.innerHTML = "";

            for(let i=0; i<count; i++) {
                let existingName = (siteData.links && siteData.links[i]) ? siteData.links[i].name : `Link ${i+1}`;
                let existingUrl = (siteData.links && siteData.links[i]) ? siteData.links[i].url : '';

                container.innerHTML += `
                    <div style="display:flex; gap:8px; margin-bottom:8px;">
                        <input type="text" id="linkName_${i}" placeholder="Tên nút ${i+1}" value="${existingName}" style="flex:1;">
                        <input type="text" id="linkUrl_${i}" placeholder="Đường dẫn URL" value="${existingUrl}" style="flex:2;">
                    </div>
                `;
            }
        }

        function upgradeToVip() {
            let targetName = document.getElementById('targetVipUser').value.trim();
            let days = parseInt(document.getElementById('vipDaysSelect').value);

            if(!targetName) {
                alert("❌ Vui lòng nhập tên tài khoản cần cấp VIP!");
                return;
            }
            let targetAcc = usersDB.find(u => u.user.toLowerCase() === targetName.toLowerCase());
            if(targetAcc) {
                targetAcc.role = 'vip';
                let now = new Date().getTime();
                targetAcc.expire = now + (days * 24 * 60 * 60 * 1000);
                localStorage.setItem('usersDB_v20', JSON.stringify(usersDB));
                alert(`✅ Đã cấp VIP thành công cho tài khoản ${targetAcc.user} trong ${days} ngày!`);
            } else {
                alert("❌ Không tìm thấy tên tài khoản này trong hệ thống!");
            }
        }

        function resetUserPassword() {
            let targetName = document.getElementById('targetVipUser').value.trim();
            let newPass = document.getElementById('resetNewPass').value.trim();

            if(!targetName || !newPass) {
                alert("❌ Vui lòng nhập tên tài khoản và mật khẩu mới cần đổi!");
                return;
            }
            let targetAcc = usersDB.find(u => u.user.toLowerCase() === targetName.toLowerCase());
            if(targetAcc) {
                targetAcc.pass = newPass;
                localStorage.setItem('usersDB_v20', JSON.stringify(usersDB));
                alert(`✅ Đã reset mật khẩu thành công cho tài khoản ${targetAcc.user}! Mật khẩu mới là: ${newPass}`);
                document.getElementById('resetNewPass').value = "";
            } else {
                alert("❌ Không tìm thấy tên tài khoản này trong hệ thống!");
            }
        }

        function compressImage(file, callback) {
            let reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = function(event) {
                let img = new Image();
                img.src = event.target.result;
                img.onload = function() {
                    let canvas = document.createElement('canvas');
                    let width = img.width;
                    let height = img.height;
                    let maxDim = 800;
                    if (width > height && width > maxDim) {
                        height *= maxDim / width;
                        width = maxDim;
                    } else if (height > maxDim) {
                        width *= maxDim / height;
                        height = maxDim;
                    }
                    canvas.width = width;
                    canvas.height = height;
                    let ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    callback(canvas.toDataURL('image/jpeg', 0.7));
                }
            }
        }

        function saveChanges() {
            siteData.name = document.getElementById('inputName').value;
            siteData.bio = document.getElementById('inputBio').value;
            siteData.music = document.getElementById('inputMusicUrl').value.trim();

            let targetRole = getUserRole(viewingUser);
            if (targetRole === 'owner' || targetRole === 'vip') {
                siteData.layout = document.getElementById('inputLayout').value;
                siteData.showBadge = document.getElementById('inputShowBadge').value;
            }

            let count = parseInt(document.getElementById('linkCountSelect').value);
            siteData.links = [];
            for(let i=0; i<count; i++) {
                let n = document.getElementById(`linkName_${i}`).value;
                let u = document.getElementById(`linkUrl_${i}`).value;
                siteData.links.push({ name: n, url: u });
            }

            let modalAvatarInput = document.getElementById('inputModalAvatar');
            let targetKey = viewingUser.toLowerCase();

            let saveAllData = () => {
                localStorage.setItem('userData_v20_' + targetKey, JSON.stringify(siteData));
                updateUI();
                closeModal();
                alert("✅ Đã lưu thay đổi thành công!");
            };

            if(modalAvatarInput.files && modalAvatarInput.files[0]) {
                compressImage(modalAvatarInput.files[0], function(compressedAvatar) {
                    siteData.avatar = compressedAvatar;
                    saveAllData();
                });
            } else {
                saveAllData();
            }
        }

        function previewAvatar(event) {
            let file = event.target.files[0];
            if(file) {
                compressImage(file, function(compressedAvatar) {
                    siteData.avatar = compressedAvatar;
                    let targetKey = viewingUser.toLowerCase();
                    localStorage.setItem('userData_v20_' + targetKey, JSON.stringify(siteData));
                    updateUI();
                });
            }
        }
    </script>
</body>
</html>
